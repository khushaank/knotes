<!DOCTYPE html>
<html lang="en">

<head>
    <script src="assets/js/theme-init.js"></script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cloudflareinsights.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; form-action 'self'; upgrade-insecure-requests;" />
    <title>Login - K. Notes</title>
    <meta name="description" content="Sign in to the private K. Notes community." />
    <meta name="robots" content="noindex, follow" />
    <link href="assets/css/styles.css?v=9" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="icon" type="image/png" href="assets/img/logo.png" />
</head>

<body class="auth-page bg-white font-body-md text-body-md text-on-surface p-4">
    <div id="message-container" class="text-sm font-bold mb-4 hidden"></div>

    <div class="mb-8">
        <b class="text-[13px] text-black">Login</b>
        <form id="login-form" class="mt-2 text-[13px]">
            <table class="border-spacing-0 border-collapse">
                <tbody>
                    <tr>
                        <td class="py-1 pr-2"><label for="login-email">email:</label></td>
                        <td class="py-1"><input type="email" id="login-email" name="email" autocomplete="email" required
                                class="border border-gray-400 p-1 text-xs w-36 focus:outline-none focus:border-[#ff6600]">
                        </td>
                    </tr>
                    <tr>
                        <td class="py-1 pr-2"><label for="login-password">password:</label></td>
                        <td class="py-1 relative">
                            <input type="password" id="login-password" name="password" autocomplete="current-password"
                                required
                                class="border border-gray-400 p-1 text-xs w-36 focus:outline-none focus:border-[#ff6600]">
                            <button type="button"
                                id="login-password-toggle"
                                class="ml-1 text-gray-500 hover:text-black focus:outline-none align-middle"
                                aria-label="Show or hide login password">
                                <span class="material-symbols-outlined text-[16px]">visibility</span>
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td class="py-2"><button type="submit"
                                class="bg-gray-200 border border-gray-400 px-2 py-0.5 hover:bg-gray-300 text-black cursor-pointer">login</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>
        <div class="mt-2 text-xs">
            <a href="#" id="forgot-password-link" class="text-blue-600 hover:underline">Forgot your password?</a>
        </div>
    </div>

    <div id="mfa-section" class="mb-4 hidden">
        <b class="text-[13px] text-black">Two-factor authentication</b>
        <form id="mfa-form" class="mt-2 text-[13px]">
            <table class="border-spacing-0 border-collapse">
                <tbody>
                    <tr>
                        <td class="py-1 pr-2"><label for="mfa-code">code:</label></td>
                        <td class="py-1"><input id="mfa-code" name="code" inputmode="numeric"
                                autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required
                                class="border border-gray-400 p-1 text-xs w-36 focus:outline-none focus:border-[#ff6600]">
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td class="py-2"><button type="submit"
                                class="bg-gray-200 border border-gray-400 px-2 py-0.5 hover:bg-gray-300 text-black cursor-pointer">verify</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>
    </div>
    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/session.js?v=8"></script>
    <script defer src="assets/js/exit-interceptor.js"></script>
</body>

</html>
